name: cakue
description: "Cakue - Catat Keuangan Gue. Aplikasi pencatatan keuangan pribadi offline-first."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.4.2
  riverpod_annotation: ^4.0.6

  # Database
  path_provider: ^2.1.5
  path: ^1.9.0

  # Navigation
  go_router: ^17.5.0

  # Models
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  uuid: ^4.4.2

  # Google Auth & Drive
  google_sign_in: ^7.2.0
  googleapis: ^16.0.0
  http: ^1.2.2

  # Security & Biometrics
  local_auth: ^2.3.0


  # UI & Charts
  fl_chart: ^1.2.0
  flutter_animate: ^4.5.0
  shimmer: ^4.0.0
  cached_network_image: ^3.4.1

  # Utils
  intl: ^0.20.3
  collection: ^1.18.0
  equatable: ^2.0.7
  shared_preferences: ^2.3.3
  connectivity_plus: ^7.3.1
  logger: ^2.4.0

  # Excel Export
  excel: ^4.0.6
  share_plus: ^10.1.4


  # Icons & Fonts
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.17
  universal_io: ^2.3.1
  iconoir_flutter: ^7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.8
  freezed: ^4.0.0
  json_serializable: ^6.8.0
  mockito: ^5.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/fonts/
    - assets/assets/fonts/
  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
